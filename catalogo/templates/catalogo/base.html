<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Catálogo Ferretería{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        header, footer { background: #f4f4f4; padding: 10px; text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
        th { background: #eee; }
    </style>
</head>
<body>
    <header>
        <h1>Ferretería Online</h1>
    </header>

    <main>
        {% block content %}
    
        {% endblock %}
    </main>

    <footer>
        <p>© 2026 Mi Proyecto Django</p>
    </footer>
</body>
</html>
