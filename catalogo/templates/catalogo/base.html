<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Catálogo Ferretería{% endblock %}</title>
    <style>
      
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #eef2f7;
            color: #333;
        }

       
        header {
            background: linear-gradient(90deg, #004080, #0059b3);
            color: #fff;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        header h1 {
            margin: 0;
            font-size: 1.8em;
            letter-spacing: 1px;
        }

        /* Navegación */
        nav a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 5px;
            transition: background 0.3s ease;
        }
        nav a:hover {
            background-color: #ffc107;
            color: #004080;
        }

        /* Contenido principal */
        main {
            padding: 30px 50px;
        }

        /* Pie de página */
        footer {
            background-color: #004080;
            color: #fff;
            text-align: center;
            padding: 15px;
            margin-top: 40px;
            font-size: 0.9em;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.2);
        }

  
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background-color: #004080;
            color: #fff;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        tr:hover {
            background-color: #e6f2ff;
        }
        tr[style] {
            font-weight: bold;
            color: #a94442;
        }

    
        .btn {
            display: inline-block;
            background-color: #004080;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .btn:hover {
            background-color: #ffc107;
            color: #004080;
        }
    </style>
</head>
<body>
    <header>
        <h1>Ferretería Online</h1>
        <nav>
            <a href="{% url 'herramientas' %}">Listado</a>
            <a href="{% url 'login' %}">Login</a>
        </nav>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <p>© 2026 Ferretería Online - Proyecto Django</p>
    </footer>
</body>
</html>
